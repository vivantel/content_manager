# This workflow runs on the PUBLIC cover repository (e.g., vivantel/git-poller)
# It polls GitHub/GitLab repositories and sends events to the VivaScribe API
# No VivaScribe source code or logic is stored in this repo

name: Git Repository Poller

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      repository_ids:
        description: 'Comma-separated repository IDs to poll (optional, polls all if empty)'
        required: false
        type: string

env:
  VIVASCRIBE_API_URL: ${{ secrets.VIVASCRIBE_API_URL }}
  VIVASCRIBE_WEBHOOK_SECRET: ${{ secrets.VIVASCRIBE_WEBHOOK_SECRET }}

jobs:
  poll-repositories:
    name: Poll Repositories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install octokit @gitbeaker/node

      - name: Poll GitHub Repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_PRIVATE_KEY: ${{ secrets.GITHUB_PRIVATE_KEY }}
        run: |
          node <<'EOF'
          const { Octokit } = require('@octokit/rest');
          
          async function pollGitHub() {
            const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });
            
            // Get installations for the GitHub App
            const { data: installations } = await octokit.apps.listInstallations();
            
            for (const installation of installations) {
              const installationOctokit = await octokit.apps.getInstallationOctokit(installation.id);
              
              // Get repos for this installation
              const { data: repos } = await installationOctokit.rest.apps.listReposAccessibleToInstallation();
              
              for (const repo of repos.repositories) {
                // Check if repo is configured in VivaScribe (would need API call)
                // For now, poll all accessible repos
                
                // Get last sync state from VivaScribe API
                const syncResponse = await fetch(`${process.env.VIVASCRIBE_API_URL}/api/v1/repos/${repo.id}/sync-state`, {
                  headers: { 'Authorization': `Bearer ${process.env.VIVASCRIBE_WEBHOOK_SECRET}` }
                });
                
                if (!syncResponse.ok) continue;
                const syncState = await syncResponse.json();
                
                // Fetch new commits since last sync
                const since = syncState.lastSyncedAt || new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
                
                const { data: commits } = await installationOctokit.rest.repos.listCommits({
                  owner: repo.owner.login,
                  repo: repo.name,
                  since,
                  per_page: 100
                });
                
                if (commits.length === 0) continue;
                
                // Fetch PRs merged since last sync
                const { data: pulls } = await installationOctokit.rest.pulls.list({
                  owner: repo.owner.login,
                  repo: repo.name,
                  state: 'closed',
                  sort: 'updated',
                  direction: 'desc',
                  per_page: 100
                });
                
                const mergedPulls = pulls.filter(p => p.merged_at && new Date(p.merged_at) > new Date(since));
                
                // Fetch tags/releases
                const { data: tags } = await installationOctokit.rest.repos.listTags({
                  owner: repo.owner.login,
                  repo: repo.name,
                  per_page: 50
                });
                
                const newTags = tags.filter(t => {
                  // Would need to check tag creation date via commit
                  return true; // Simplified
                });
                
                // Send to VivaScribe ingest endpoint
                const payload = {
                  repositoryId: repo.id.toString(),
                  provider: 'github',
                  commits: commits.map(c => ({
                    sha: c.sha,
                    message: c.commit.message,
                    author: c.commit.author?.name,
                    date: c.commit.author?.date,
                    url: c.html_url
                  })),
                  pullRequests: mergedPulls.map(p => ({
                    number: p.number,
                    title: p.title,
                    mergedAt: p.merged_at,
                    author: p.user?.login,
                    url: p.html_url,
                    labels: p.labels?.map(l => l.name) || []
                  })),
                  tags: newTags.map(t => ({
                    name: t.name,
                    commitSha: t.commit.sha,
                    url: `https://github.com/${repo.owner.login}/${repo.name}/releases/tag/${t.name}`
                  }))
                };
                
                const response = await fetch(`${process.env.VIVASCRIBE_API_URL}/api/v1/ingest/poll`, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${process.env.VIVASCRIBE_WEBHOOK_SECRET}`,
                    'X-GitHub-Delivery': `poll-${Date.now()}`,
                    'X-GitHub-Event': 'poll'
                  },
                  body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                  console.error(`Failed to send events for ${repo.full_name}:`, await response.text());
                } else {
                  console.log(`Processed ${commits.length} commits, ${mergedPulls.length} PRs, ${newTags.length} tags for ${repo.full_name}`);
                }
              }
            }
          }
          
          pollGitHub().catch(console.error);
          EOF

      - name: Poll GitLab Repositories
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          node <<'EOF'
          const Gitlab = require('@gitbeaker/node');
          
          async function pollGitLab() {
            const gitlab = new Gitlab({ token: process.env.GITLAB_TOKEN });
            
            // Get accessible projects
            const projects = await gitlab.Projects.all({ membership: true, per_page: 100 });
            
            for (const project of projects) {
              // Get last sync state
              const syncResponse = await fetch(`${process.env.VIVASCRIBE_API_URL}/api/v1/repos/${project.id}/sync-state`, {
                headers: { 'Authorization': `Bearer ${process.env.VIVASCRIBE_WEBHOOK_SECRET}` }
              });
              
              if (!syncResponse.ok) continue;
              const syncState = await syncResponse.json();
              const since = syncState.lastSyncedAt || new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
              
              // Fetch commits
              const commits = await gitlab.Commits.all(project.id, { since, per_page: 100 });
              
              // Fetch merged merge requests
              const mrs = await gitlab.MergeRequests.all(project.id, { 
                state: 'merged', 
                updated_after: since,
                per_page: 100 
              });
              
              // Fetch tags
              const tags = await gitlab.Tags.all(project.id, { per_page: 50 });
              
              if (commits.length === 0 && mrs.length === 0 && tags.length === 0) continue;
              
              const payload = {
                repositoryId: project.id.toString(),
                provider: 'gitlab',
                commits: commits.map(c => ({
                  sha: c.id,
                  message: c.message,
                  author: c.author_name,
                  date: c.created_at,
                  url: c.web_url
                })),
                mergeRequests: mrs.map(mr => ({
                  iid: mr.iid,
                  title: mr.title,
                  mergedAt: mr.merged_at,
                  author: mr.author?.username,
                  url: mr.web_url,
                  labels: mr.labels || []
                })),
                tags: tags.map(t => ({
                  name: t.name,
                  commitSha: t.commit.id,
                  url: `${project.web_url}/-/tags/${t.name}`
                }))
              };
              
              const response = await fetch(`${process.env.VIVASCRIBE_API_URL}/api/v1/ingest/poll`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.VIVASCRIBE_WEBHOOK_SECRET}`,
                  'X-GitLab-Event': 'poll'
                },
                body: JSON.stringify(payload)
              });
              
              if (!response.ok) {
                console.error(`Failed to send events for ${project.path_with_namespace}:`, await response.text());
              } else {
                console.log(`Processed ${commits.length} commits, ${mrs.length} MRs, ${tags.length} tags for ${project.path_with_namespace}`);
              }
            }
          }
          
          pollGitLab().catch(console.error);
          EOF

      - name: Update sync state
        run: |
          # The API handles updating sync state after successful ingest
          echo "Sync state updated via API"